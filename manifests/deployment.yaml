apiVersion: apps/v1
kind: Deployment
metadata:
  name: will-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: will-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: will-playground
    spec:
      containers:
        - name: will-playground
          image: wil42/playground:v2
---
apiVersion: v1
kind: Service
metadata:
  name: will-playground
  namespace: dev
spec:
  ports:
      - protocol: TCP
        port: 8888
        targetPort: 8888
  selector:
    app.kubernetes.io/name: will-playground
  type: ClusterIP
