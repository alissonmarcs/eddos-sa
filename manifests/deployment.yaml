apiVersion: apps/v1
kind: Deployment
metadata:
  name: will-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: will-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: will-playground
    spec:
      containers:
        - name: will-playground
          image: wil42/playground:v2
---
apiVersion: v1
kind: Service
metadata:
  name: will-playground
  namespace: dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: will-playground
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888
